<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Data Extractor | Mazhar Shams</title>
    <meta name="description" content="Upload a receipt image and extract structured data using AI. Built by Mazhar Shams.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- Receipt Extractor Page Styles --- */

        .extractor-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .extractor-nav {
            padding: 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition-base);
        }

        .back-link:hover {
            color: var(--accent-primary);
        }

        .extractor-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .extractor-container {
            width: 100%;
            max-width: 640px;
        }

        .extractor-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .extractor-header h1 {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .extractor-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* Upload Zone */
        .upload-zone {
            background: var(--glass-bg);
            border: 2px dashed var(--glass-border);
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-base);
            position: relative;
        }

        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.04);
        }

        .upload-zone.has-file {
            border-style: solid;
            border-color: rgba(99, 102, 241, 0.3);
        }

        .upload-icon {
            color: var(--text-muted);
            margin-bottom: 1rem;
            transition: var(--transition-base);
        }

        .upload-zone:hover .upload-icon {
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .upload-zone h3 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .upload-zone p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .file-input {
            display: none;
        }

        /* File Preview */
        .file-preview {
            display: none;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 14px;
            margin-top: 1rem;
        }

        .file-preview.visible {
            display: flex;
        }

        .file-preview-thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            background: var(--glass-bg);
        }

        .file-preview-info {
            flex: 1;
            min-width: 0;
        }

        .file-preview-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-preview-size {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .file-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 8px;
            transition: var(--transition-base);
        }

        .file-remove:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Extract Button */
        .extract-btn-wrapper {
            margin-top: 1.5rem;
        }

        .extract-btn {
            width: 100%;
            padding: 1rem 2rem;
            border: none;
            border-radius: 14px;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-base);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-tertiary));
            color: white;
            box-shadow: 0 8px 24px -8px rgba(99, 102, 241, 0.4);
        }

        .extract-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(99, 102, 241, 0.5);
        }

        .extract-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading State */
        .loading-state {
            display: none;
            text-align: center;
            padding: 3rem 2rem;
        }

        .loading-state.visible {
            display: block;
        }

        .loader {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-primary);
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-state p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .loading-state .loading-sub {
            font-size: 0.8rem;
            margin-top: 0.4rem;
            opacity: 0.6;
        }

        /* Error State */
        .error-state {
            display: none;
            padding: 1.5rem;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 14px;
            margin-top: 1.5rem;
        }

        .error-state.visible {
            display: block;
        }

        .error-state p {
            color: #fca5a5;
            font-size: 0.9rem;
        }

        .error-state .error-title {
            font-weight: 600;
            color: #f87171;
            margin-bottom: 0.3rem;
        }

        /* Results */
        .result-container {
            display: none;
            margin-top: 2rem;
            animation: fadeUp 0.5s ease-out;
        }

        .result-container.visible {
            display: block;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .result-header h3 {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .copy-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-family: var(--font-body);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .copy-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .copy-btn.copied {
            border-color: #22c55e;
            color: #22c55e;
        }

        .result-json {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text-muted);
            max-height: 500px;
            overflow-y: auto;
        }

        .result-json .json-key {
            color: #93c5fd;
        }

        .result-json .json-string {
            color: #86efac;
        }

        .result-json .json-number {
            color: #fcd34d;
        }

        .result-json .json-boolean,
        .result-json .json-null {
            color: #c4b5fd;
        }

        .result-json .json-bracket {
            color: var(--text-muted);
        }

        /* New Extraction Button */
        .new-extract-btn {
            margin-top: 1.5rem;
            width: 100%;
            padding: 0.8rem 2rem;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            background: transparent;
            color: var(--text-muted);
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-base);
        }

        .new-extract-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .extractor-header h1 {
                font-size: 1.7rem;
            }

            .upload-zone {
                padding: 2rem 1.5rem;
            }

            .result-json {
                font-size: 0.75rem;
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="dark-mode">
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="extractor-page">
        <nav class="extractor-nav">
            <a href="/" class="back-link" id="back-home-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Back
            </a>
        </nav>

        <main class="extractor-main">
            <div class="extractor-container">
                <div class="extractor-header">
                    <h1>Receipt <span class="gradient-text">Extractor</span></h1>
                    <p>Upload a receipt image and get structured data back instantly.</p>
                </div>

                <!-- Upload Area -->
                <div id="upload-section">
                    <div class="upload-zone" id="upload-zone">
                        <div class="upload-icon">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <h3>Drop your receipt here</h3>
                        <p>or click to browse &middot; PNG, JPG, WEBP, PDF up to 10MB</p>
                        <input type="file" class="file-input" id="file-input" accept="image/png,image/jpeg,image/webp,application/pdf">
                    </div>

                    <div class="file-preview" id="file-preview">
                        <img class="file-preview-thumb" id="file-thumb" src="" alt="Preview">
                        <div class="file-preview-info">
                            <div class="file-preview-name" id="file-name"></div>
                            <div class="file-preview-size" id="file-size"></div>
                        </div>
                        <button class="file-remove" id="file-remove" aria-label="Remove file">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>

                    <div class="extract-btn-wrapper">
                        <button class="extract-btn" id="extract-btn" disabled>
                            Extract Data
                        </button>
                    </div>

                    <div class="error-state" id="error-state">
                        <p class="error-title">Something went wrong</p>
                        <p id="error-message">Please try again.</p>
                    </div>
                </div>

                <!-- Loading State -->
                <div class="loading-state" id="loading-state">
                    <div class="loader"></div>
                    <p>Analyzing your receipt...</p>
                    <p class="loading-sub">This usually takes a few seconds</p>
                </div>

                <!-- Result -->
                <div class="result-container" id="result-container">
                    <div class="result-header">
                        <h3>Extracted Data</h3>
                        <button class="copy-btn" id="copy-btn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy JSON
                        </button>
                    </div>
                    <pre class="result-json" id="result-json"></pre>
                    <button class="new-extract-btn" id="new-extract-btn">Extract Another Receipt</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');
        const fileThumb = document.getElementById('file-thumb');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const fileRemove = document.getElementById('file-remove');
        const extractBtn = document.getElementById('extract-btn');
        const uploadSection = document.getElementById('upload-section');
        const loadingState = document.getElementById('loading-state');
        const resultContainer = document.getElementById('result-container');
        const resultJson = document.getElementById('result-json');
        const copyBtn = document.getElementById('copy-btn');
        const newExtractBtn = document.getElementById('new-extract-btn');
        const errorState = document.getElementById('error-state');
        const errorMessage = document.getElementById('error-message');

        let selectedFile = null;
        let rawJsonString = '';

        // --- File Selection ---
        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && (file.type.startsWith('image/') || file.type === 'application/pdf')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (file.size > 10 * 1024 * 1024) {
                showError('File is too large. Please upload an image or PDF under 10MB.');
                return;
            }
            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatSize(file.size);
            
            if (file.type === 'application/pdf') {
                fileThumb.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>';
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    fileThumb.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            uploadZone.classList.add('has-file');
            filePreview.classList.add('visible');
            extractBtn.disabled = false;
            hideError();
        }

        fileRemove.addEventListener('click', (e) => {
            e.stopPropagation();
            clearFile();
        });

        function clearFile() {
            selectedFile = null;
            fileInput.value = '';
            fileThumb.src = '';
            uploadZone.classList.remove('has-file');
            filePreview.classList.remove('visible');
            extractBtn.disabled = true;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // --- Extract ---
        extractBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            hideError();

            // Show loading
            uploadSection.style.display = 'none';
            loadingState.classList.add('visible');
            resultContainer.classList.remove('visible');

            try {
                const base64 = await fileToBase64(selectedFile);

                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: base64,
                        mimeType: selectedFile.type
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to extract data');
                }

                rawJsonString = JSON.stringify(data.result, null, 2);
                resultJson.innerHTML = syntaxHighlight(rawJsonString);

                loadingState.classList.remove('visible');
                resultContainer.classList.add('visible');

            } catch (err) {
                loadingState.classList.remove('visible');
                uploadSection.style.display = 'block';
                showError(err.message || 'Something went wrong. Please try again.');
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64 = reader.result.split(',')[1];
                    resolve(base64);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // --- JSON Syntax Highlighting ---
        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(
                /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function (match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                }
            );
        }

        // --- Copy ---
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(rawJsonString);
                copyBtn.classList.add('copied');
                copyBtn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Copied!
                `;
                setTimeout(() => {
                    copyBtn.classList.remove('copied');
                    copyBtn.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                        Copy JSON
                    `;
                }, 2000);
            } catch (err) {
                console.error('Copy failed', err);
            }
        });

        // --- New Extraction ---
        newExtractBtn.addEventListener('click', () => {
            resultContainer.classList.remove('visible');
            uploadSection.style.display = 'block';
            clearFile();
        });

        // --- Error Handling ---
        function showError(msg) {
            errorMessage.textContent = msg;
            errorState.classList.add('visible');
        }

        function hideError() {
            errorState.classList.remove('visible');
        }
    </script>
</body>
</html>
